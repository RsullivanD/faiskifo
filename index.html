<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faiskifo</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main id="app">
    <section id="auth" class="card">
      <h2 id="auth-heading">Se connecter</h2>

      <div id="auth-logged-out">
        <p class="field-hint">Entre ton courriel pour recevoir un lien magique.</p>
        <input id="auth-email-otp" type="email" placeholder="ton@courriel.com" autocomplete="email" />
        <button id="auth-send-btn" class="btn-primary btn-full" type="button">Envoyer le lien magique</button>
        <p id="auth-otp-status" class="auth-status hidden"></p>
      </div>

      <div id="auth-logged-in" class="hidden">
        <p>Connecté en tant que <strong id="auth-user-email"></strong></p>
        <button id="auth-logout-btn" class="btn-secondary" type="button">Se déconnecter</button>
      </div>
    </section>

    <section id="app-content" class="hidden">
      <div class="app-tabs">
        <button id="tab-focus-btn" class="tab-btn tab-active" type="button">Session</button>
        <button id="tab-history-btn" class="tab-btn" type="button">Historique</button>
      </div>

      <section id="focus-view" class="card">
        <h2>Session</h2>

        <div id="selector-view">
          <div class="stack">
            <label for="category-select">Catégorie</label>
            <select id="category-select">
              <option value="">Choisis une catégorie</option>
            </select>
          </div>

          <div class="stack">
            <label for="task-select">Tâche</label>
            <select id="task-select" disabled>
              <option value="">Choisis une tâche</option>
            </select>
          </div>

          <div class="stack">
            <label for="step-select">Étape</label>
            <select id="step-select" disabled>
              <option value="">Choisis une étape</option>
            </select>
          </div>

          <div class="stack">
            <label for="timer-minutes">Temps accordé (minutes)</label>
            <input id="timer-minutes" type="number" min="1" value="10" />
          </div>

          <div class="row">
            <button id="start-session-btn" class="btn-primary" type="button">Démarrer</button>
          </div>
        </div>

        <section id="current-step" class="card hidden current-card">
          <h3>Étape en cours</h3>
          <p id="current-step-text"></p>
          <div id="timer">00:00</div>
          <div class="row">
            <button id="pause-timer-btn" class="btn-secondary" type="button">Pause</button>
            <button id="resume-timer-btn" class="btn-secondary" type="button">Reprendre</button>
            <button id="mark-done-btn" class="btn-success" type="button">Terminé</button>
          </div>
        </section>
      </section>

      <section id="history-view" class="card hidden">
        <h2>Historique</h2>
        <div id="history-list"></div>
      </section>
    </section>

    <div id="toast-container"></div>

    <div id="confirm-modal" class="modal hidden">
      <div class="modal-content card">
        <h3 id="confirm-modal-title">Confirmer ?</h3>
        <div class="row">
          <button id="confirm-modal-ok" class="btn-primary" type="button">Oui</button>
          <button id="confirm-modal-cancel" class="btn-secondary" type="button">Non</button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
