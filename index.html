<section id="auth" aria-labelledby="auth-heading">
  <h2 id="auth-heading">Se connecter</h2>

  <div id="auth-logged-out">
    <div class="auth-method-toggle" role="group" aria-label="Méthode de connexion">
      <button id="auth-method-password-btn" class="auth-method-btn auth-method-active" aria-pressed="true" type="button">
        🔐 Compte
      </button>
      <button id="auth-method-otp-btn" class="auth-method-btn" aria-pressed="false" type="button">
        📧 Code par courriel
      </button>
    </div>

    <div id="auth-form-password">
      <p class="field-hint">Crée ton compte ou connecte-toi avec ton courriel et ton mot de passe.</p>
      <input id="auth-email" type="email" placeholder="ton@courriel.com" autocomplete="email" />
      <input id="auth-password" type="password" placeholder="Mot de passe" autocomplete="new-password" />
      <input id="auth-password-confirm" type="password" placeholder="Confirmer le mot de passe" autocomplete="new-password" />

      <div class="row">
        <button id="auth-signup-btn" class="btn-primary">Créer un compte</button>
        <button id="auth-login-btn" class="btn-secondary">Se connecter</button>
      </div>

      <p id="auth-password-status" class="auth-status hidden"></p>
    </div>

    <div id="auth-form-otp" class="hidden">
      <p class="field-hint">Reçois un code à usage unique ou un lien magique par courriel.</p>
      <input id="auth-email-otp" type="email" placeholder="ton@courriel.com" autocomplete="email" />
      <button id="auth-send-btn" class="btn-primary btn-full">Envoyer le code</button>
      <p id="auth-otp-status" class="auth-status hidden"></p>
    </div>
  </div>

  <div id="auth-logged-in" class="hidden">
    <p>Connecté en tant que <strong id="auth-user-email"></strong></p>
    <button id="auth-logout-btn" class="btn-secondary">Se déconnecter</button>
  </div>
</section>
